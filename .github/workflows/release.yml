name: Release

# Push a tag like v1.2.0 (or run this by hand with a version) to build a signed release APK
# and publish it as a GitHub release. The version name comes from the tag; the version code
# is major*10000 + minor*100 + patch, so every release installs over the one before.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          raw="${INPUT_VERSION:-$REF_NAME}"
          ver="${raw#v}"
          if [[ ! "$ver" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The version must look like 1.2.3 (got '$raw')."; exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch must be 0-99 so the version code keeps increasing."; exit 1
          fi
          echo "name=$ver" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Check the secrets are set
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ORS_KEY: ${{ secrets.ORS_KEY }}
          AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
          AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
          AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
          AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}
        run: |
          missing=()
          for name in GOOGLE_SERVICES_JSON ORS_KEY AURA_KEYSTORE_BASE64 AURA_KEYSTORE_PASSWORD AURA_KEY_ALIAS AURA_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. Add them under Settings > Secrets and variables > Actions."; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash .github/scripts/google-services.sh --strict

      - name: Signing key
        env:
          AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$AURA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aura-release.jks"
          echo "AURA_KEYSTORE_FILE=$RUNNER_TEMP/aura-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ORS_KEY: ${{ secrets.ORS_KEY }}
          AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
          AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
          AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: ./gradlew assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" --console=plain

      - name: Check the APK is release-signed
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $signer"
          certs=$("$signer" verify --verbose --print-certs "$apk" 2>&1) || { echo "$certs"; echo "::error::apksigner could not verify the APK."; exit 1; }
          echo "$certs"
          if echo "$certs" | grep -qi "CN=Android Debug"; then
            echo "::error::The APK is signed with a debug key; check the signing secrets."; exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/Aura-$VERSION_NAME.apk"
          (cd dist && sha256sum "Aura-$VERSION_NAME.apk" > "Aura-$VERSION_NAME.apk.sha256")
          rm -f "$RUNNER_TEMP/aura-release.jks"

      - name: Release notes
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*.*.*' "HEAD^" 2>/dev/null || true)
          {
            if [[ -n "$prev" ]]; then echo "Changes since $prev:"; else echo "First release."; fi
            echo
            git log --no-merges --pretty='- %s' ${prev:+"$prev"..}HEAD | head -40
            echo
            echo "Install: download Aura-${TAG#v}.apk on an Android 13+ phone and open it. Android asks once to allow installs from your browser."
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Aura ${{ steps.v.outputs.name }}
          body_path: notes.md
          files: |
            dist/Aura-${{ steps.v.outputs.name }}.apk
            dist/Aura-${{ steps.v.outputs.name }}.apk.sha256
          make_latest: true
